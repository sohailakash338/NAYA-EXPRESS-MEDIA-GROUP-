<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',Arial,sans-serif;background:#060606;color:#fff;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:25px 20px 60px}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0 40px}
.logo-box{display:flex;align-items:center;gap:16px}
.logo{width:70px;height:70px;border-radius:50%;border:3px solid #f4b400;box-shadow:0 0 25px rgba(244,180,0,0.4);overflow:hidden;padding:0}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-text h3{font-size:21px;font-weight:800;color:#fff;letter-spacing:0.5px}
.logo-text p{font-size:11px;color:#00ff88;letter-spacing:2px;margin-top:3px;font-weight:600}
.secure{display:flex;align-items:center;gap:8px;color:#00ff88;font-size:13px;font-weight:700}

.main-title{text-align:center;color:#777;letter-spacing:5px;font-size:13px;margin-bottom:8px;font-weight:700}
.member{text-align:center;font-size:15px;color:#aaa;margin-bottom:12px;font-weight:600;letter-spacing:2px}
h1{text-align:center;font-size:52px;color:#00ff88;font-weight:800;margin-bottom:18px;text-shadow:0 0 35px rgba(0,255,136,0.6);letter-spacing:2px}
.desc{text-align:center;color:#999;font-size:16px;line-height:1.8;max-width:520px;margin:0 auto 50px}

.verify-box{background:linear-gradient(135deg, rgba(12,25,15,0.98) 0%, rgba(8,15,10,0.98) 100%);border:2.5px solid rgba(0,255,136,0.6);border-radius:22px;padding:45px 35px;box-shadow:0 0 50px rgba(0,255,136,0.2);margin-bottom:70px;max-width:600px;margin-left:auto;margin-right:auto}
.label-green{color:#00ff88;font-size:14px;font-weight:800;letter-spacing:3px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.label-green::before{content:"";width:5px;height:22px;background:#00ff88;border-radius:3px;box-shadow:0 0 12px #00ff88}

input{width:100%;background:#080808;border:2.5px solid #1a2a1a;border-radius:16px;padding:22px;color:#fff;font-size:18px;text-align:center;margin-bottom:22px;font-family:'Poppins';transition:0.3s;letter-spacing:2px;font-weight:600}
input:focus{outline:none;border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.5);background:#0a0a0a}
input::placeholder{color:#444;letter-spacing:1px}

.verify-btn{width:100%;background:transparent;border:3px solid #ffb400;color:#ffb400;padding:22px;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer;transition:0.3s;letter-spacing:3px}
.verify-btn:hover{background:#ffb400;color:#000;box-shadow:0 0 35px rgba(255,180,0,0.7);transform:translateY(-4px)}

.cards-grid{display:none;grid-template-columns:1fr;gap:40px;margin-top:50px;animation:fadeIn 0.7s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

.press-card{background:linear-gradient(135deg,#0a3d62 0%,#1e6091 100%);border-radius:28px;border:6px solid #f4b400;box-shadow:0 0 60px rgba(244,180,0,0.5);overflow:hidden;width:100%;max-width:520px;margin:0 auto}
.card-header{background:#f4b400;color:#0a3d62;text-align:center;padding:24px;font-weight:800;font-size:22px;letter-spacing:1.5px}
.sub-header{text-align:center;padding:18px;background:#0a3d62;font-size:20px;border-bottom:5px solid #f4b400;font-weight:700;color:#fff}
.status-bar{background:#28a745;color:#fff;text-align:center;padding:18px;font-weight:800;font-size:20px;letter-spacing:1.5px}

.card-body{padding:35px 30px;line-height:3.2;font-size:20px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:18px}
.photo-box{width:100%;height:380px;border:6px solid #f4b400;margin:0 0 25px 0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 30px rgba(244,180,0,0.6);float:none}
.photo-box img{width:100%;height:100%;object-fit:cover;object-position:center top}
.label{font-weight:800;color:#f4b400;display:inline-block;width:140px;font-size:20px}

.chief-section{clear:both;padding-top:25px;margin-top:25px;border-top:3px solid rgba(244,180,0,0.5);text-align:center;font-size:18px}
.chief-title{color:#f4b400;font-weight:800;margin-bottom:8px;font-size:19px}
.footer{text-align:center;padding:18px;background:#000;font-size:14px;color:#ccc;border-top:4px solid #f4b400;font-weight:700}

.site-footer{text-align:center;padding:40px 0 20px;color:#555;font-size:15px;border-top:1px solid #1a1a1a;margin-top:60px}
.site-footer a{color:#00ff88;text-decoration:none;margin:0 15px;font-weight:700}

@media(max-width:640px){
.cards-grid{grid-template-columns:1fr}
h1{font-size:40px}
.top-bar{flex-direction:column;gap:20px}
.photo-box{height:340px}
.card-body{padding:30px 25px;font-size:18px}
.label{width:120px;font-size:18px}
.logo{width:60px;height:60px}
.press-card{max-width:100%}
}
</style>
</head>
<body>

<div class="container">

<div class="top-bar">
    <div class="logo-box">
        <div class="logo">
            <img src="logo.png" alt="NEX Logo">
        </div>
        <div class="logo-text">
            <h3>Naya Express Media Group</h3>
            <p>VOICE OF TRUTH . STRENGTH OF NATION</p>
        </div>
    </div>
    <div class="secure">
        <svg fill="currentColor" viewBox="0 0 24 24" width="20"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Secure Verification
    </div>
</div>

<div class="main-title">NAYA EXPRESS MEDIA GROUP</div>
<div class="member">MEMBER</div>
<h1>VERIFICATION</h1>
<p class="desc">Enter CNIC to verify all 6 newspaper press cards at once.</p>

<div class="verify-box" id="verifyBox">
    <div class="label-green">ENTER CNIC NUMBER</div>
    <input type="text" id="cnicNo" placeholder="33202-3211081-7">
    <button class="verify-btn" onclick="verifyCard()">VERIFY NOW »</button>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<div class="site-footer">
    © 2026 Naya Express Media Group · <a href="#">Home</a> · <a href="#">Admin</a>
</div>

</div>

<script>
const newspapers = [
    "روزنامہ نیا ایکسپریس",
    "روزنامہ نیو نوائے وقت", 
    "روزنامہ نیا زمانہ",
    "روزنامہ نیشنل دنیا",
    "روزنامہ معاشرہ لاہور",
    "روزنامہ نیو دنیا لاہور"
];

const memberData = {
    name: "GHULAM RAZA GORAYA",
    cnic: "33202-3211081-7",
    designation: "C E O",
    city: "JHANG",
    phone: "03467242941",
    mobile: "03467792566",
    status: "Active"
};

function verifyCard(){
    let cnic = document.getElementById('cnicNo').value.trim();
    if(cnic === memberData.cnic){
        document.getElementById('verifyBox').style.display = 'none';
        let grid = document.getElementById('cardsGrid');
        grid.style.display = 'grid';
        grid.innerHTML = '';
        
        newspapers.forEach((paper, index) => {
            grid.innerHTML += `
            <div class="press-card">
                <div class="card-header">NAYA EXPRESS MEDIA GROUP</div>
                <div class="sub-header">${paper}</div>
                <div class="status-bar">✓ Status: ${memberData.status}</div>
                
                <div class="card-body">
                    <div class="photo-box">
                        <img src="photo${index+1}.jpg" alt="Member Photo">
                    </div>
                    
                    <div><span class="label">Name:</span> ${memberData.name}</div>
                    <div><span class="label">Designation:</span> ${memberData.designation}</div>
                    <div><span class="label">City:</span> ${memberData.city}</div>
                    <div><span class="label">CNIC:</span> ${memberData.cnic}</div>
                    <div><span class="label">Phone:</span> ${memberData.phone}</div>
                    <div><span class="label">Mobile:</span> ${memberData.mobile}</div>
                    
                    <div class="chief-section">
                        <div class="chief-title">Chief Editor</div>
                        <div>Ghulam Raza Garaya</div>
                        <div style="color:#f4b400;margin-top:10px;font-size:16px;font-weight:700">Contact: 0300-XXXXXXX</div>
                    </div>
                </div>
                
                <div class="footer">
                    This card is for identification purpose only
                </div>
            </div>`;
        });
        
        grid.scrollIntoView({behavior:'smooth'});
    } else if(cnic === ""){
        alert('براہ کرم CNIC نمبر درج کریں');
    } else {
        alert('Invalid CNIC Number!');
    }
}
</script>

</body>
</html>
